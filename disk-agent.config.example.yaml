# Example project-local overrides (optional).
# Primary config lives at ~/.disk-agent/config.yaml after `disk-agent setup`.

agentName: Disk

# Directory used by coding tools (read/bash/edit/write)
# cwd: /path/to/your/project

model:
  # OpenCode Go / OpenCode Zen subscription (opencode.ai, shares ~/.pi/agent/auth.json)
  # or any pi provider with a key (anthropic / openai / google, see .env.example)
  provider: opencode-go
  id: grok-4.5
  # Alternatives:
  # id: kimi-k2.6
  # id: deepseek-v4-flash
  # provider: opencode
  # id: claude-sonnet-4-5
  # provider: anthropic
  # id: claude-sonnet-4-20250514
  # provider: openai
  # id: gpt-5.4
  thinking: medium

telegram:
  enabled: true
  # botToken: set via TELEGRAM_BOT_TOKEN env instead
  dmPolicy: pairing # pairing | allowlist | owner_only | open
  allowFrom: []
  # ownerId: "123456789"
  groupsRequireMention: true
  streamEdits: true
  maxMessageChars: 3900

cron:
  enabled: true
  heartbeat:
    enabled: true
    everyMinutes: 30
    quietHours:
      start: 23
      end: 8

browser:
  enabled: true
  headless: true
  timeoutMs: 60000
  # allowedDomains: ["example.com"]

memory:
  enabled: true
  maxFacts: 200
  injectUserMd: true
  injectSoulMd: true
  injectMemoryMd: true
  injectDailyLog: true
  dailyLogDays: 2

security:
  bashGuard: true

# Telegram voice notes / audio → Whisper STT (needs OPENAI_API_KEY or GROQ_API_KEY)
voice:
  enabled: true
  provider: auto # auto | openai | groq | none
  # model: whisper-1              # openai default
  # model: whisper-large-v3-turbo # groq default
  # language: en                  # optional ISO-639-1 hint
  includeAudio: true
  # maxBytes: 20971520

logging:
  level: info
